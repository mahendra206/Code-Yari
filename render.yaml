# Render.com Infrastructure as Code
# This file auto-configures your web service + PostgreSQL database on Render
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: code-yari-db
    plan: free
    databaseName: codeyaridb
    user: codeyari

services:
  - type: web
    name: code-yari
    plan: free
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: /

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://code-yari.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: code-yari-db
          property: connectionString
