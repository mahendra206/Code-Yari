# Render.com Infrastructure as Code
# This file auto-configures your web service + PostgreSQL database on Render
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: code-yari-db
    plan: free
    databaseName: codeyaridb
    user: codeyari

services:
  - type: web
    name: code-yari
    plan: free
    runtime: python
    buildCommand: "bash ./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: /

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,codeyari.com,www.codeyari.com,.codeyari.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://code-yari.onrender.com,https://codeyari.com,https://www.codeyari.com"
      - key: DATABASE_URL
        fromDatabase:
          name: code-yari-db
          property: connectionString
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: "codeyari7307@gmail.com"
      - key: ADMIN_EMAIL
        value: "codeyari7307@gmail.com"
      - key: DEFAULT_FROM_EMAIL
        value: "Code Yari <codeyari7307@gmail.com>"
      - key: EMAIL_HOST_PASSWORD
        sync: false
