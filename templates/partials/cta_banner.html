{% load static %}
<section class="site-cta-section">
  <div class="container">
    <div class="cta-inner-card position-relative overflow-hidden">
      <!-- Decorative Glow Orbs -->
      <div class="cta-orb-ring cta-orb-outer" aria-hidden="true"></div>
      <div class="cta-orb-ring cta-orb-inner" aria-hidden="true"></div>
      <div class="cta-orb-dot" aria-hidden="true"></div>

      <div class="row align-items-center justify-content-between position-relative z-1 g-3 g-md-4">
        <!-- Left: Badge, Heading & Subtitle -->
        <div class="col-lg-8 col-md-8 col-12">
          <div class="cta-badge-pill mb-3">
            <i class="bi bi-megaphone-fill me-2"></i>Let's Work Together
          </div>
          <h2 class="cta-main-title mb-2 mb-md-3">
            Let's Build Something <span class="cta-accent-text">Great Together.</span>
          </h2>
          <p class="cta-sub-text mb-0">
            Have an idea? Let's turn it into a digital solution that grows your business.
          </p>
        </div>

        <!-- Right: Action Button -->
        <div class="col-lg-4 col-md-4 col-12 text-md-end text-start pt-2 pt-md-0">
          <a href="{% url 'leads:get_quote' %}" class="btn-cta-quote">
            <span>Get a Quote</span>
            <i class="bi bi-arrow-right ms-2"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
