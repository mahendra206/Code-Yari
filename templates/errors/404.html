{% extends 'base.html' %}

{% block title %}404 — Page Not Found | Code Yari{% endblock %}

{% block content %}
<section class="d-flex align-items-center justify-content-center text-center py-5" style="min-height: 75vh; padding-top: calc(var(--nav-height) + 4rem) !important;">
  <div class="container">
    <div class="card-custom p-5 mx-auto" style="max-width: 600px;">
      <div class="display-1 fw-bold gradient-text mb-2">404</div>
      <h1 class="h3 fw-bold mb-3">Oops! Page Not Found</h1>
      <p class="text-secondary mb-4">
        The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
      </p>
      <div class="d-flex justify-content-center gap-3">
        <a href="{% url 'core:home' %}" class="btn-brand">
          <i class="bi bi-house-door-fill"></i>
          <span>Return to Home</span>
        </a>
        <a href="{% url 'core:contact' %}" class="btn-brand-outline">
          <span>Contact Support</span>
        </a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
